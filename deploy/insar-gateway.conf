# ──────────────────────────────────────────────────────────────────────────────
# Reference reverse-proxy config for production (nginx). Edge-isolates the InSAR
# data API (:8002) and the Weespas API (:8000) behind one TLS-terminating gateway,
# so neither app process is publicly routable on its own port — they bind to
# 127.0.0.1 and only this gateway can reach them.
#
# This is REFERENCE MATERIAL, not wired into the dev launchers. Adapt hostnames,
# cert paths, and upstreams to your infra. See PE/SECURITY.md §4 / §7.
# ──────────────────────────────────────────────────────────────────────────────

# Upstreams bind to loopback only (app processes started with --host 127.0.0.1).
upstream weespas_api { server 127.0.0.1:8000; }
upstream insar_api   { server 127.0.0.1:8002; }

# Redirect all plain HTTP to HTTPS.
server {
    listen 80;
    server_name api.weespas.example insar.weespas.example;
    return 301 https://$host$request_uri;
}

# ── Weespas API (identity + revenue plane) ────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.weespas.example;

    ssl_certificate     /etc/ssl/weespas/fullchain.pem;
    ssl_certificate_key /etc/ssl/weespas/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # HSTS is also set by the app when cookie_secure=True; declaring it here too is
    # belt-and-suspenders (covers error responses that bypass the app middleware).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://weespas_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── InSAR data API (the asset we just gated) ──────────────────────────────────
server {
    listen 443 ssl http2;
    server_name insar.weespas.example;

    ssl_certificate     /etc/ssl/insar/fullchain.pem;
    ssl_certificate_key /etc/ssl/insar/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The app enforces the RS256 token itself (defence in depth). The gateway's job is
    # edge isolation + TLS; it does NOT need to re-verify the token. Keep the Authorization
    # header flowing through to the app.
    location / {
        proxy_pass http://insar_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    # Optional hard belt: the bundle is large + cacheable per-ETag; let the app's
    # ETag/Cache-Control drive it, don't add an nginx cache that could serve a stale
    # (pre-realignment) bundle. See app/main.py aoi_bundle docstring.
}
